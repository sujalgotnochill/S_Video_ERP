<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#F8FAFC;
    padding:20px;
    color:#1F2937;
}

h2{
    margin-bottom:20px;
    color:#2563EB;
}

.card{
    background:white;
    border-radius:10px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.row{
    display:flex;
    gap:15px;
    margin-bottom:15px;
}

.col{
    flex:1;
}

label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:6px;
}

input,
select,
textarea{
    width:100%;
    padding:10px;
    border:1px solid #D1D5DB;
    border-radius:8px;
    font-size:14px;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#2563EB;
}

textarea{
    resize:vertical;
    min-height:80px;
}

.checkbox-group{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    margin-top:8px;
}

.checkbox-group label{
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:500;
    cursor:pointer;
}

.checkbox-group input{
    width:auto;
}

button{
    width:100%;
    background:#2563EB;
    color:white;
    border:none;
    border-radius:8px;
    padding:12px;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    background:#1D4ED8;
}

hr{
    margin:18px 0;
    border:none;
    border-top:1px solid #E5E7EB;
}

.search-box{
    position:relative;
}

.suggestions{
    position:absolute;
    top:100%;
    left:0;
    right:0;
    background:#fff;
    border:1px solid #D1D5DB;
    border-top:none;
    border-radius:0 0 8px 8px;
    max-height:220px;
    overflow-y:auto;
    z-index:999;
    display:none;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.suggestion-item{
    padding:10px 12px;
    cursor:pointer;
    transition:.15s;
}

.suggestion-item:hover{
    background:#EFF6FF;
}

.no-result{
    padding:10px 12px;
    color:#6B7280;
    font-style:italic;
}
.suggestion-item.active {
  background: #1976d2;
  color: white;
}

.suggestion-item b {
  color: #d32f2f;
}

.suggestion-item.active b {
  color: #fff176;
}


</style>

<script>
document.addEventListener("input", function(e) {

  const el = e.target;

  if (
    el.tagName === "INPUT" &&
    el.type === "text"
  ) {
    el.value = el.value.toUpperCase();
  }

  if (el.tagName === "TEXTAREA") {
    el.value = el.value.toUpperCase();
  }

});
</script>
