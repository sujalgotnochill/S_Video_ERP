<!DOCTYPE html>
<html>

<head>

<base target="_top">

<style>

body{

background:#f3f5f7;
font-family:Arial;
padding:20px;

}

.card{

background:white;
padding:20px;
border-radius:12px;
box-shadow:0 3px 12px rgba(0,0,0,.15);

}

h2{

margin-top:0;
text-align:center;

}

label{

display:block;
margin-top:12px;
font-weight:bold;

}

input,textarea{

width:100%;
padding:10px;
box-sizing:border-box;
margin-top:4px;
border:1px solid #ccc;
border-radius:6px;

}

textarea{

height:80px;
resize:vertical;

}

button{

width:100%;
padding:12px;
margin-top:20px;
background:#1a73e8;
border:none;
color:white;
font-size:15px;
border-radius:6px;
cursor:pointer;

}

button:hover{

background:#1557b0;

}

button:disabled{

background:#999;

}

.success{

margin-top:15px;
padding:10px;
background:#d4edda;
color:#155724;
border-radius:6px;
display:none;

}

.error{

margin-top:15px;
padding:10px;
background:#f8d7da;
color:#721c24;
border-radius:6px;
display:none;

}

</style>

</head>

<body>

<div class="card">

<h2>New Studio</h2>

<label>Studio Name *</label>
<input id="studioName">

<label>Owner Name *</label>
<input id="ownerName">

<label>Mobile Number *</label>
<input id="mobile">

<label>WhatsApp Number</label>
<input id="whatsapp">

<label>City / Area *</label>
<input id="city">

<label>Notes</label>
<textarea id="notes"></textarea>

<button id="btn" onclick="saveStudio()">

Save Studio

</button>

<div id="success" class="success"></div>

<div id="error" class="error"></div>

</div>

<script>

function clearMessages(){

document.getElementById("success").style.display="none";
document.getElementById("error").style.display="none";

}

function showSuccess(msg){

const s=document.getElementById("success");

s.innerHTML=msg;

s.style.display="block";

}

function showError(msg){

const e=document.getElementById("error");

e.innerHTML=msg;

e.style.display="block";

}

function clearForm(){

document.getElementById("studioName").value="";
document.getElementById("ownerName").value="";
document.getElementById("mobile").value="";
document.getElementById("whatsapp").value="";
document.getElementById("city").value="";
document.getElementById("notes").value="";

document.getElementById("studioName").focus();

}

function saveStudio(){

clearMessages();

const btn=document.getElementById("btn");

const data={

studioName:studioName.value.trim(),
ownerName:ownerName.value.trim(),
mobile:mobile.value.trim(),
whatsapp:whatsapp.value.trim(),
city:city.value.trim(),
notes:notes.value.trim()

};

if(!data.studioName){

showError("Studio Name is required.");

return;

}

if(!data.ownerName){

showError("Owner Name is required.");

return;

}

if(!data.mobile){

showError("Mobile Number is required.");

return;

}

if(!data.city){

showError("City / Area is required.");

return;

}

btn.disabled=true;

btn.innerHTML="Saving...";

google.script.run

.withSuccessHandler(function(){

btn.disabled=false;

btn.innerHTML="Save Studio";

showSuccess("✅ Studio added successfully.");

clearForm();

})

.withFailureHandler(function(err){

btn.disabled=false;

btn.innerHTML="Save Studio";

showError(err.message);

})

.saveStudio(data);

}

document.querySelectorAll('input:not([type="number"]):not([type="tel"]), textarea').forEach(function(el) {

  el.addEventListener("input", function() {

    const start = this.selectionStart;
    const end = this.selectionEnd;

    this.value = this.value.toUpperCase();

    if (this.selectionStart !== null) {
      this.setSelectionRange(start, end);
    }

  });

});

</script>

</body>

</html>
