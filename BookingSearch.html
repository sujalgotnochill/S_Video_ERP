<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Styles'); ?>
  <style>
    body { background-color: #f8fafc; padding: 20px; font-family: sans-serif; }
    .card { background: #ffffff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .section-title { color: #1e293b; font-size: 18px; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid #EFF6FF; padding-bottom: 8px; }
    
    /* Search Bar */
    .search-input { width: 100%; padding: 12px 15px; border: 2px solid #BFDBFE; border-radius: 8px; font-size: 15px; outline: none; margin-bottom: 20px; transition: 0.2s; }
    .search-input:focus { border-color: #2563EB; }
    
    /* Table Styles */
    table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; }
    th { background-color: #EFF6FF; color: #1e3a8a; padding: 12px; border-bottom: 2px solid #BFDBFE; font-weight: bold; }
    td { padding: 12px; border-bottom: 1px solid #e5e7eb; color: #374151; vertical-align: middle; }
    tr:hover { background-color: #f8fafc; }
    
    /* Status Badges */
    .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; }
    .status-pending { background: #FEF3C7; color: #92400E; }
    .status-progress { background: #DBEAFE; color: #1E40AF; }
    .status-completed { background: #D1FAE5; color: #065F46; }
    .status-delivered { background: #F3F4F6; color: #374151; }

    /* Edit Button */
    .btn-edit { background: #2563EB; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s; }
    .btn-edit:hover { background: #1D4ED8; box-shadow: 0 2px 4px rgba(37,99,235,0.3); }

    #loading { text-align: center; color: #2563EB; font-weight: bold; display: none; padding: 20px; }
    .empty-state { text-align: center; color: #6b7280; padding: 30px; font-style: italic; }
  </style>
</head>
<body>

<div class="card">
  <div class="section-title">🔍 Search Bookings</div>
  <input type="text" id="searchInput" class="search-input" placeholder="Search by Studio Name, City, Mobile, or Booking No..." oninput="triggerSearch()">
  
  <div id="loading">Searching... ⏳</div>
  
  <div style="overflow-x: auto;">
    <table>
      <thead>
        <tr>
          <th>Booking #</th>
          <th>Date</th>
          <th>Studio / Customer</th>
          <th>Service</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="resultsBody">
        <!-- Results inject here -->
      </tbody>
    </table>
  </div>
</div>

<script>
let searchTimeout = null;

// Load initial recent bookings on open
window.onload = function() {
  triggerSearch();
};

function triggerSearch() {
  const query = document.getElementById("searchInput").value;
  
  // Debounce: Wait 300ms after user stops typing before searching
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    document.getElementById("loading").style.display = "block";
    document.getElementById("resultsBody").innerHTML = "";
    
    google.script.run
      .withSuccessHandler(renderResults)
      .withFailureHandler(err => { alert(err.message); document.getElementById("loading").style.display = "none"; })
      .searchBookings(query);
  }, 300);
}

function renderResults(results) {
  document.getElementById("loading").style.display = "none";
  const tbody = document.getElementById("resultsBody");
  tbody.innerHTML = "";

  if (results.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty-state">No matching bookings found.</td></tr>`;
    return;
  }

  results.forEach(b => {
    const tr = document.createElement("tr");
    
    // Status Badge Logic
    let statusClass = "status-pending";
    if (b.status === "In Progress") statusClass = "status-progress";
    if (b.status === "Completed") statusClass = "status-completed";
    if (b.status === "Delivered") statusClass = "status-delivered";

    // Format the city display
    const cityHtml = b.city ? `<br><span style="font-size: 11px; color: #6b7280;">📍 ${b.city}</span>` : "";

    tr.innerHTML = `
      <td><strong>${b.bookingNo}</strong></td>
      <td>${b.date}</td>
      <td>
        <strong>${b.studioName}</strong>
        ${cityHtml}
      </td>
      <td>${b.service}</td>
      <td><span class="status-badge ${statusClass}">${b.status || "Pending"}</span></td>
      <td>
        <button class="btn-edit" onclick="editBooking('${b.bookingNo}')">✏️ Edit</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function editBooking(bookingNo) {
  // Show a loading state on the button
  event.target.textContent = "Loading...";
  event.target.disabled = true;
  
  google.script.run
    .withFailureHandler(err => alert("Error opening booking: " + err.message))
    .openEditBookingDialog(bookingNo);
}
</script>

</body>
</html>
